<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Purchase</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
      font-family: Arial, Helvetica, sans-serif;
    }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      background:
        radial-gradient(circle at 50% 25%, rgba(0, 255, 170, 0.20), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(0, 120, 255, 0.16), transparent 35%),
        linear-gradient(145deg, #07110f, #020506 55%, #00140f);
    }

    .glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(0, 255, 170, 0.08);
      filter: blur(70px);
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 30px;
    }

    .logo {
      font-size: 15px;
      letter-spacing: 5px;
      font-weight: 700;
      color: #00ffad;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -2px;
      color: white;
      margin-bottom: 16px;
    }

    .subtitle {
      color: #a7b5b1;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 auto 34px;
      max-width: 300px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 220px;
      height: 58px;
      border-radius: 14px;
      background: #00ffad;
      color: #00150f;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 12px 35px rgba(0, 255, 173, 0.25);
      transition: 0.2s ease;
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 45px rgba(0, 255, 173, 0.35);
    }

    .download-btn span {
      margin-right: 9px;
      font-size: 20px;
    }

    .bottom-text {
      margin-top: 35px;
      color: #66736f;
      font-size: 12px;
    }

    @media (min-width: 431px) {
      .phone {
        min-height: 820px;
        height: 90vh;
        border-radius: 28px;
        box-shadow: 0 0 80px rgba(0, 255, 173, 0.08);
      }
    }
  </style>
</head>

<body>

  <main class="phone">

    <div class="glow"></div>

    <section class="content">

      <div class="logo">PLAN PURCHASE</div>

      <h1>Earn.<br>Grow.<br>Repeat.</h1>

      <p class="subtitle">
        Download the Plan Purchase app and get started today.
      </p>

      <!-- APK DOWNLOAD -->
      <a
        class="download-btn"
        href="app-release.apk"
        download="Plan-Purchase.apk"
      >
        <span>↓</span>
        Download App
      </a>

      <p class="bottom-text">
        Android App • Secure & Easy
      </p>

    </section>

  </main>

</body>
</html>
